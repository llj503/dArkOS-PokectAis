name: Vita3K-Plus ARMv8.0 (Pocket AIS)

# Builds the Vita3K-Plus Qt desktop frontend for Cortex-A53 (RK3562).
# Qt 6.11 is installed from Qt's linux_arm64 online repository because no
# distribution ships a new enough Qt. The bundle includes the Qt runtime and
# is intended to run under Weston (DRM/KMS) on dArkOS.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag suffix"
        required: true
        default: "20261111"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      VERSION: ${{ inputs.version }}
      TAG: vita3k-plus-armv8a-${{ inputs.version }}
      NAME: pocketAis-Vita3KPlus-armv8a-${{ inputs.version }}

    steps:
      - name: Checkout dArkOS build scripts
        uses: actions/checkout@v4
        with:
          path: hostrepo

      - name: Checkout Vita3K-Plus
        uses: actions/checkout@v4
        with:
          repository: nckstwrt/Vita3K-Plus
          ref: v1.4-Corrected
          path: vita3k
          submodules: recursive
          fetch-depth: 1

      # The v1.4-Corrected tag is out of sync with itself: it never committed the
      # generated util/fork_build.h, codec/src/atrac9.cpp calls Atrac9DecodeBounded()
      # which the pinned LibAtrac9 gitlink does not export, surface_cache.cpp has
      # ambiguous braced assignments under C++23, and main.cpp's post-install
      # auto-boot writes run_app_path to a Config that was already moved away.
      - name: Patch Vita3K source
        run: |
          python3 hostrepo/darkos/image_build/patch_vita3k.py "$GITHUB_WORKSPACE/vita3k"
          git -C vita3k rev-parse HEAD
          git -C vita3k submodule status external/LibAtrac9

      - name: Install build packages
        run: |
          # ports.ubuntu.com has hung for >20min on arm runners (2026-11-11), so
          # bound every acquire and fall back to public ubuntu-ports mirrors.
          APT_OPTS="-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::ForceIPv4=true"
          apt_update() {
            timeout 240 sudo apt-get $APT_OPTS update && return 0
            for m in https://mirrors.tuna.tsinghua.edu.cn/ubuntu-ports http://ftp.jaist.ac.jp/pub/Linux/ubuntu-ports; do
              echo "apt update failed, trying mirror $m"
              sudo sed -i "s|http://ports.ubuntu.com/ubuntu-ports|$m|g; s|https://ports.ubuntu.com/ubuntu-ports|$m|g" \
                /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
              timeout 240 sudo apt-get $APT_OPTS update && return 0
            done
            return 1
          }
          apt_update
          timeout 600 sudo apt-get $APT_OPTS -y install \
            build-essential cmake ninja-build git pkg-config python3 python3-pip patchelf zstd gcc-14 g++-14 \
            libssl-dev libasound2-dev libpulse-dev libjack-dev libsndio-dev libfribidi-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libegl-dev libgles-dev libgl-dev libvulkan-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libpipewire-0.3-dev \
            libwayland-dev libdecor-0-dev liburing-dev libgtk-3-dev

      - name: Install Qt 6.11 (official linux_arm64)
        run: |
          python3 -m pip install --user --break-system-packages aqtinstall
          python3 -m aqt list-qt linux_arm64 desktop --modules 6.11.0 linux_gcc_arm64 || true
          python3 -m aqt install-qt linux_arm64 desktop 6.11.0 linux_gcc_arm64 \
            -m qtmultimedia qtimageformats \
            -O "$HOME/Qt"
          QTDIR=$(find "$HOME/Qt/6.11.0" -maxdepth 1 -mindepth 1 -type d | head -1)
          [ -n "$QTDIR" ] || { echo "Qt 6.11 arm64 install not found"; find "$HOME/Qt" -maxdepth 3 -type d; exit 1; }
          echo "QTDIR=$QTDIR" >> "$GITHUB_ENV"
          test -f "$QTDIR/bin/qmake" || test -f "$QTDIR/bin/qtpaths"
          # dArkOS has no X server: the Wayland platform plugin is mandatory.
          # qtwayland is part of the base archives (not an add-on module) and
          # Qt 6.11 ships it as a single libqwayland.so.
          ls -l "$QTDIR/plugins/platforms/"
          ls "$QTDIR"/plugins/platforms/libqwayland*.so >/dev/null 2>&1 || {
            echo "::error::Qt 6.11 linux_arm64 has no Wayland platform plugin"; exit 1; }

      - name: Configure Vita3K
        working-directory: vita3k
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QTDIR" \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DVITA3K_FORCE_CUSTOM_BOOST=ON \
            -DENABLE_DISCORD_RICH_PRESENCE=OFF \
            -DCMAKE_C_FLAGS="-march=armv8-a -moutline-atomics" \
            -DCMAKE_CXX_FLAGS="-march=armv8-a -moutline-atomics" \
            .

      - name: Build vita3k
        working-directory: vita3k
        run: cmake --build build --target vita3k -j $(nproc)

      - name: Package bundle
        working-directory: vita3k
        run: |
          bash "$GITHUB_WORKSPACE/hostrepo/darkos/image_build/package_vita3k.sh" \
            "$GITHUB_WORKSPACE/vita3k/build" "$QTDIR" "$NAME" "$GITHUB_WORKSPACE/vita3k"

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: vita3k
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$NAME.tar.zst" "$NAME.tar.zst.sha256" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$NAME.tar.zst" "$NAME.tar.zst.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Vita3K-Plus ARMv8.0 ${VERSION} (Pocket AIS)" \
              --prerelease \
              --notes "Vita3K-Plus v1.4-Corrected Qt frontend for Cortex-A53/RK3562, bundled Qt 6.11, -march=armv8-a -moutline-atomics. Runs under Weston on dArkOS."
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vita3k-plus-armv8a-${{ inputs.version }}
          path: |
            vita3k/pocketAis-Vita3KPlus-armv8a-${{ inputs.version }}.tar.zst
            vita3k/pocketAis-Vita3KPlus-armv8a-${{ inputs.version }}.tar.zst.sha256
